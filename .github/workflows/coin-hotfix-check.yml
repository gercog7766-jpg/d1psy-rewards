name: Coin hotfix isolated checks
on:
  push:
    branches: [fix/coin-ledger-production-20261105]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
