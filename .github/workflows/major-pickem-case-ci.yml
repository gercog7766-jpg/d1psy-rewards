name: Major Pickem case CI
on:
  pull_request:
    paths:
      - 'src/major-pickem*'
      - 'supabase/migrations/20261118143000_major_bronze_case.sql'
      - 'tests/major-bronze-case*'
      - 'package.json'
      - '.github/workflows/major-pickem-case-ci.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
