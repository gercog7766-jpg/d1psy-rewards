name: Contracts checks
on:
  pull_request:
    paths:
      - 'src/contracts*'
      - 'tests/contracts*'
      - 'supabase/migrations/*contracts*'
      - '.github/workflows/contracts-checks.yml'
  push:
    branches: [main]
    paths:
      - 'src/contracts*'
      - 'tests/contracts*'
      - 'supabase/migrations/*contracts*'
      - '.github/workflows/contracts-checks.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
