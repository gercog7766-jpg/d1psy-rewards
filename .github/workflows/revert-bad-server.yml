name: Restore server
on: workflow_dispatch
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - run: git checkout HEAD^ -- src/server-next.ts
      - run: |
          git config user.name d1psy-rewards-bot
          git config user.email actions@users.noreply.github.com
          git add src/server-next.ts
          git commit -m 'Restore server-next'
          git push
