name: Multi-Twitch safety checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/multistream-safe-cutover]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies (repository has no lockfile)
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Streamer authorization regression tests
        run: node --test tests/multistream-guards.test.mjs
      - name: TypeScript check
        run: npm run typecheck
      - name: Build
        run: npm run build
