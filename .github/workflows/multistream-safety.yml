name: Multi-Twitch safety checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/multistream-safe-cutover]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies (repository has no lockfile)
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Streamer authorization regression tests
        run: node --test tests/multistream-guards.test.mjs
      - name: TypeScript check
        run: npm run typecheck
      - name: Build
        run: npm run build

  postgres-concurrency:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: multistream_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d multistream_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify concurrent prize reservations in disposable PostgreSQL
        run: bash tests/sql/run-concurrency.sh
