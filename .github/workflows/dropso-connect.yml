name: Dropso Connect Windows
on:
  push:
    branches: [main]
    paths: ['desktop/connect/**', 'scripts/connect/**', '.github/workflows/dropso-connect.yml']
  pull_request:
    paths: ['desktop/connect/**', 'scripts/connect/**', '.github/workflows/dropso-connect.yml']
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.4'
          cache: false
      - name: Native Windows tests
        working-directory: desktop/connect
        run: go test ./...
      - name: Build desktop application
        working-directory: desktop/connect
        run: go build -trimpath -buildvcs=false -ldflags='-s -w -H windowsgui' -o DropsoConnect.exe .
      - name: Smoke test desktop and local listener
        shell: pwsh
        run: |
          $program = Start-Process ./desktop/connect/DropsoConnect.exe -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(15)
            do {
              Start-Sleep -Milliseconds 250
              $program.Refresh()
              if ($program.HasExited) { throw 'Desktop application exited unexpectedly' }
            } until ($program.MainWindowHandle -ne 0 -or (Get-Date) -gt $deadline)
            if ($program.MainWindowHandle -eq 0) { throw 'Desktop window did not appear' }
            if (!$program.Responding) { throw 'Desktop window is not responding' }
            $response = Invoke-WebRequest http://127.0.0.1:28743/ -SkipHttpErrorCheck
            if ($response.StatusCode -ne 403) { throw 'Local panel must require its per-run key' }
            $response = Invoke-WebRequest http://127.0.0.1:28743/gsi -Method Post -ContentType application/json -Body '{"auth":{"token":"wrong"}}' -SkipHttpErrorCheck
            if ($response.StatusCode -ne 403) { throw 'GSI must require its local secret' }
            $second = Start-Process ./desktop/connect/DropsoConnect.exe -PassThru
            try { if (!$second.WaitForExit(5000)) { throw 'Second launch must restore the existing window and exit' } }
            finally { if (!$second.HasExited) { Stop-Process -Id $second.Id -ErrorAction SilentlyContinue } }
          } finally { Stop-Process -Id $program.Id -ErrorAction SilentlyContinue }
      - name: Package the admin download
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          Copy-Item desktop/connect/DropsoConnect.exe public/downloads/DropsoConnect.exe
          python scripts/connect/package.py
      - name: Publish the packaged download
        if: github.event_name == 'push'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/downloads/DropsoConnect.exe.gz public/downloads/DropsoConnect.json
          if git diff --cached --quiet; then
            echo "Packaged download is already current"
          else
            git commit -m "Release Dropso Connect $(python -c 'import json; print(json.load(open("public/downloads/DropsoConnect.json"))["version"])')"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: DropsoConnect-Windows-x64
          path: desktop/connect/DropsoConnect.exe
