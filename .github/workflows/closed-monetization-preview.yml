name: Closed monetization preview checks
on:
  push:
    branches:
      - codex/monetization-closed-preview-20261127
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build-and-test:
    if: github.event_name == 'push' || github.head_ref == 'codex/monetization-closed-preview-20261127'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
