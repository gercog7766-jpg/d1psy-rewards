name: Closed monetization preview checks
on:
  push:
    branches:
      - codex/membership-player-launch
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build-and-test:
    if: github.event_name == 'push' || github.head_ref == 'codex/membership-player-launch'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node --import tsx scripts/verify-closed-preview.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: closed-preview-screenshots
          path: preview-screenshots/
          if-no-files-found: ignore
